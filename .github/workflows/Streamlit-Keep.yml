name: Streamlit 自动唤醒

on:
  # 1. 支持手动触发
  workflow_dispatch:
    inputs:
      target_url:
        description: '目标链接 (留空则使用默认URL)'
        required: false
        type: string

  # 2. 支持 Uptime-Kuma Webhook 触发 (离线秒级唤醒)
  repository_dispatch:
    types: [streamlit_offline_trigger] 

permissions:
  contents: read

jobs:
  wakeup:
    name: 唤醒应用
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: 安装依赖包
        run: |
          echo "正在安装 Playwright..."
          pip install playwright
          echo "正在安装 Firefox 浏览器..."
          python -m playwright install firefox
          echo "依赖安装完成！"
          
      - name: 执行唤醒脚本
        env:
          # 优先使用手动传入的 URL，否则使用默认的 Streamlit 地址
          TARGET_URL: ${{ inputs.target_url || 'https://python-6argo-bo-va8myj9cc6eplqoyuc9uct.streamlit.app' }}
        run: |
          echo "开始执行 Streamlit 应用唤醒任务..."
          echo "当前目标网址: $TARGET_URL"
          python Keep.py
          echo "唤醒任务执行完毕！"

      - name: 清理历史运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 3
